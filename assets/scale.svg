<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t"><title id="t">Drawing scale comparison</title><rect width="900" height="360" rx="24" fill="#f7faff"/><g font-family="Arial,sans-serif" fill="#183557"><text x="35" y="44" font-size="29" font-weight="700">Scale = drawing size : actual size</text><text x="230" y="95" text-anchor="middle" font-size="22">Reduction — 1:2</text><text x="450" y="95" text-anchor="middle" font-size="22">Full size — 1:1</text><text x="690" y="95" text-anchor="middle" font-size="22">Enlargement — 2:1</text><rect x="115" y="135" width="230" height="115" rx="4" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><rect x="390" y="135" width="115" height="115" rx="4" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><rect x="585" y="135" width="230" height="115" rx="4" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="230" y="292" text-anchor="middle" font-size="19">Drawing is smaller</text><text x="450" y="292" text-anchor="middle" font-size="19">Same size</text><text x="700" y="292" text-anchor="middle" font-size="19">Drawing is larger</text></g></svg>
