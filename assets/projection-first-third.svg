<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">First-angle and third-angle projection symbols</title><desc id="desc">First angle has the truncated cone symbol to the left of the circular end view; third angle has the circular end view to the left of the truncated cone symbol, matching the lecture diagram.</desc><rect width="1000" height="420" rx="24" fill="#f7faff"/><g font-family="Arial,sans-serif" fill="#15345a"><text x="250" y="45" text-anchor="middle" font-size="28" font-weight="700">FIRST-ANGLE PROJECTION</text><text x="750" y="45" text-anchor="middle" font-size="28" font-weight="700">THIRD-ANGLE PROJECTION</text><line x1="500" y1="25" x2="500" y2="395" stroke="#cad7e8" stroke-width="3"/><text x="250" y="380" text-anchor="middle" font-size="20">Symbol: side view LEFT, end view RIGHT</text><text x="750" y="380" text-anchor="middle" font-size="20">Symbol: end view LEFT, side view RIGHT</text></g><g transform="translate(85 110)" stroke="#175da7" stroke-width="5" fill="none" stroke-linejoin="round"><path d="M0 20 L160 75 L160 190 L0 245 Z" fill="#dbeafe"/><ellipse cx="0" cy="132" rx="34" ry="112" stroke-dasharray="9 8" opacity=".55"/><line x1="-25" y1="132" x2="185" y2="132" stroke-dasharray="12 7"/><line x1="80" y1="45" x2="80" y2="220" stroke-dasharray="12 7"/></g><g transform="translate(300 235)" fill="#dbeafe" stroke="#175da7" stroke-width="5"><circle r="76"/><circle r="42" fill="none"/><path d="M-96 0H96 M0 -96V96" stroke-dasharray="12 7" fill="none"/></g><g transform="translate(570 235)" fill="#dbeafe" stroke="#175da7" stroke-width="5"><circle r="76"/><circle r="42" fill="none"/><path d="M-96 0H96 M0 -96V96" stroke-dasharray="12 7" fill="none"/></g><g transform="translate(700 110)" stroke="#175da7" stroke-width="5" fill="none" stroke-linejoin="round"><path d="M0 20 L160 75 L160 190 L0 245 Z" fill="#dbeafe"/><ellipse cx="0" cy="132" rx="34" ry="112" stroke-dasharray="9 8" opacity=".55"/><line x1="-25" y1="132" x2="185" y2="132" stroke-dasharray="12 7"/><line x1="80" y1="45" x2="80" y2="220" stroke-dasharray="12 7"/></g></svg>
