<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t"><title id="t">2D geometric shapes</title><rect width="900" height="560" rx="24" fill="#f7faff"/><g font-family="Arial,sans-serif" fill="#183557" font-size="20" text-anchor="middle"><text x="450" y="42" font-size="29" font-weight="700">2-D Geometric Shapes</text><circle cx="135" cy="145" r="55" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="135" y="225">Circle</text><path d="M335 90 L270 200 L400 200 Z" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="335" y="225">Triangle</text><rect x="500" y="95" width="105" height="105" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="552" y="225">Square</text><rect x="700" y="110" width="145" height="85" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="772" y="225">Rectangle</text><path d="M135 300 L185 335 L166 395 L104 395 L85 335 Z" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="135" y="430">Pentagon</text><path d="M330 295 L380 325 L380 375 L330 405 L280 375 L280 325 Z" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="330" y="440">Hexagon</text><path d="M520 300 L565 315 L585 355 L565 395 L520 410 L475 395 L455 355 L475 315 Z" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="520" y="440">Octagon</text><path d="M700 310 L845 310 L815 400 L730 400 Z" fill="#dbeafe" stroke="#155ca8" stroke-width="4"/><text x="775" y="440">Trapezium</text><text x="450" y="510" font-size="18" fill="#637891">A regular polygon has equal sides AND equal angles.</text></g></svg>
